site_name: Report Wiki
site_description: Project documentation, decisions, and report guidance

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow
    - content.action.edit
    - content.code.copy
    - content.code.select
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Use light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Follow system preference

nav:
  - Logs for Building Attention Blocks: index.md
  # - Getting started:
  #     - Overview: getting-started/index.md
  #     - Run the site: getting-started/run-the-site.md
  # - Writing guide:
  #     - Add and edit content: guide/index.md
  #     - Markdown examples: guide/markdown-examples.md
  #     - Organize navigation: guide/navigation.md
  # - Project reference:
  #     - Source brief: reference/project-brief.md
  #     - Content template: reference/content-template.md
  # - Deployment:
  #     - Cloudflare Workers: deployment/cloudflare-workers.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: en

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/
      name: Project repository

copyright: Copyright &copy; 2026 Report Wiki
